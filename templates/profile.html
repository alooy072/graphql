<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GraphQL Login</title>
</head>

<body>


    <div id="logout-div">
        <button type="button">Logout</button>
    </div>

    <main>
        <div id="user-info">
            <span id="username"></span>
            <span id="user-id"></span>
            <span id="email"></span>
        </div>

        <div>
            <span id="total-xp"></span>
        </div>

        <div>
            <span id="audit-ratio"></span>
        </div>

        <div id="chart-container">
            <!-- The SVG wrapper container -->
            <svg id="bar-chart" width="600" style="border: 1px solid #ccc;">
                <line x1="150" y1="10" x2="150" y2="10" stroke="#333" stroke-width="2" />
            </svg>
        </div>
    </main>
</body>

<script type="module" src="../js/profile.js"></script>

</html>
